site_name: AutoSub-AI
site_url: https://victorcodificando.github.io/AutoSub-AI/
repo_url: https://github.com/VictorCodificando/AutoSub-AI

theme:
  name: material
  language: es

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

  font:
    text: Roboto
    code: Roboto Mono

  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: es

nav:
  - Inicio: index.md
  - Cómo funciona: funcionamiento/pipeline.md
  - Decisiones técnicas: decisiones.md
  - Recorrido: recorrido.md
  - Calidad: calidad.md
  - Hoja de ruta: hoja_de_ruta.md
  - Instalación: uso/instalacion.md
